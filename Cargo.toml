[workspace]
resolver = "2"
members = ["crates/luxor-core", "src-tauri"]
# `src-tauri` needs system webkit/gtk libs on Linux; keep default members to the
# pure-logic core so `cargo check`/`cargo test` work everywhere.
default-members = ["crates/luxor-core"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/adxptived/luxor"
authors = ["Luxor contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
