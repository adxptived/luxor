name: Visual Regression

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "shot.mjs"
      - "playwright.config.ts"

jobs:
  visual-regression:
    name: Visual Regression (shot.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run visual regression snapshots
        # Vite MUST start and be used inside a single step. Actions terminates a
        # step's background children when the step's shell exits, so the old
        # "start in step A, use in step B" split only ever worked by luck — and
        # the retry loop's `exit 0` ended step A successfully while leaving
        # nothing running for step B.
        run: |
          bunx vite --port 5173 --strictPort &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Vite did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done
          node shot.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: /tmp/shot_*.png
          if-no-files-found: warn

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bun run e2e
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          if-no-files-found: warn
